<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root {
  --sky-top: #ff7fc0;
  --sky-bottom: #ffd0e8;
  --hot: #e8157b;
  --hot-dark: #9c0a52;
  --ink: #3a0a26;
  --cream: #fff4fa;
  --blush: #ffb3d9;
  --display: "Reem Kufi", "Cairo", "Tahoma", sans-serif;
  --utility: "Cairo", "Tahoma", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-top);
  background-image: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--utility);
  font-size: 20px;
  overflow-x: hidden;
  padding-inline: 16px;
}
#hills { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 30vh; z-index: 0; pointer-events: none; }
#floaters { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.floater { position: absolute; bottom: -30px; opacity: 0; animation: rise linear forwards; }
@keyframes rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: .85; }
  100% { transform: translateY(-110vh) translateX(var(--drift, 20px)); opacity: 0; }
}
.sparkle { position: fixed; z-index: 1; width: 12px; height: 12px; pointer-events: none; animation: twinkle 2.4s steps(2, jump-none) infinite; }
.sparkle::before, .sparkle::after { content: ""; position: absolute; background: var(--cream); }
.sparkle::before { left: 4px; top: 0; width: 4px; height: 12px; }
.sparkle::after { left: 0; top: 4px; width: 12px; height: 4px; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

main {
  position: relative; z-index: 2;
  min-height: 100%;
  max-width: 640px;
  margin-inline: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: 28px 20vh;
}
.screen { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; animation: pop .35s steps(5) both; }
@keyframes pop { from { transform: translateY(14px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

.frame {
  width: clamp(120px, 34vw, 170px); aspect-ratio: 1;
  background: var(--ink);
  border: 6px solid var(--hot);
  outline: 4px solid var(--cream);
  box-shadow: 0 8px 0 4px var(--hot-dark);
  display: grid; place-items: center; padding: 10px;
}
.frame svg { width: 100%; height: 100%; display: block; }
.frame.bob { animation: bob 1.2s steps(2, jump-none) infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }

h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.5; text-wrap: balance; color: var(--hot); text-shadow: 3px 3px 0 var(--cream); }
h1 { font-size: clamp(26px, 8vw, 40px); }
h2 { font-size: clamp(24px, 7vw, 34px); }
.sub { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.4; color: var(--ink); max-width: 30ch; text-wrap: balance; }

.btn {
  font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.2;
  color: var(--cream); background: var(--hot);
  border: 4px solid var(--ink);
  padding: 14px 18px;
  box-shadow: inset -4px -4px 0 var(--hot-dark), inset 4px 4px 0 #ff5fae, 0 5px 0 var(--ink);
  cursor: pointer; border-radius: 0;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(3px); }
.btn:focus-visible, .opt:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.btn.ghost { background: var(--cream); color: var(--hot-dark); box-shadow: inset -4px -4px 0 var(--blush), 0 5px 0 var(--ink); }
a.btn { display: inline-block; text-decoration: none; text-align: center; }

.opt {
  font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.4; color: var(--hot-dark); background: var(--cream);
  border: 4px solid var(--ink); padding: 16px 8px; cursor: pointer; border-radius: 0; min-width: 0;
  box-shadow: 0 5px 0 var(--hot-dark);
}
.opt:hover { background: #ffe3f1; }
.stack { display: flex; flex-direction: column; gap: 14px; width: min(100%, 440px); }
.stack .opt { font-size: 20px; padding: 14px 12px; }

.ticket {
  font-family: var(--utility); font-weight: 600; font-size: 20px; line-height: 1.9; text-align: start;
  background: var(--cream); color: var(--ink);
  border: 5px solid var(--hot); outline: 4px solid var(--ink);
  padding: 18px 20px; width: min(100%, 420px);
  box-shadow: 0 8px 0 4px var(--hot-dark);
  overflow-wrap: anywhere;
}
.ticket b { color: var(--hot); font-weight: normal; }
.row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.toast { min-height: 1.2em; margin: 0; font-size: 20px; font-weight: 600; color: var(--hot-dark); }

.dialog {
  width: min(100%, 460px); min-height: 190px; text-align: start;
  background: var(--cream); border: 5px solid var(--hot); outline: 4px solid var(--ink);
  box-shadow: 0 8px 0 4px var(--hot-dark); padding: 20px 20px 34px; position: relative; cursor: pointer;
}
.dialog p { font-family: var(--utility); font-weight: 600; font-size: 21px; line-height: 1.9; margin: 0; color: var(--ink); overflow-wrap: anywhere; }
.dialog .more { position: absolute; inset-inline-end: 16px; bottom: 8px; font-family: var(--display); font-size: 16px; color: var(--hot); animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (max-width: 420px) {
  .dialog p { font-size: 19px; }
  .btn { font-size: 18px; padding: 12px 14px; }
  .opt { font-size: 17px; }
  .ticket { font-size: 18px; padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .floater { display: none; }
}
</style>
</head>
<body>

<svg id="hills" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
<div id="floaters" aria-hidden="true"></div>
<span class="sparkle" style="left:8%;top:14%"></span>
<span class="sparkle" style="right:10%;top:22%;animation-delay:.8s"></span>
<span class="sparkle" style="left:18%;top:62%;animation-delay:1.4s"></span>
<span class="sparkle" style="right:16%;top:54%;animation-delay:.3s"></span>

<main id="app" aria-live="polite"></main>

<script>
var CONFIG = {
  to: "",     // اسمها
  from: "",   // اسمك
  whatsapp: "21625114993",   // رقمك مع الرمز الدولي، بلا + وبلا فراغات
  lines: [
    "عسلامة {to}.",
    "عندي حاجة نحب نقولهالك من برشا وقت.",
    "نحبك بالرسمي. موش كلام وأكهو، هذي مشاعر موجودة من 5 سنين، من أول ما شفتك.",
    "نعرف إنك تعيش في بلاصة بعيدة عليا، أما المسافة ما بدلتش حتى شي من إحساسي ليك.",
    "أنا برك ما حبيتش نخبيها في قلبي. إنتي تخلي نهاري أحسن، حتى من بعيد.",
    "وكيما كان إحساسك، فرحان إلي قلتهالك."
  ]
};

var CAT = [
  "..kk........kk..",
  ".kwwk......kwwk.",
  ".kwpwkkkkkkwpwk.",
  ".kwpwwwwwwwwpwk.",
  "kwwwwwwwwwwwwwwk",
  "kwwkwwwwwwwwkwwk",
  "kwwkwwwwwwwwkwwk",
  "kwwwwwwppwwwwwwk",
  "kwppwwwwwwwwppwk",
  "kwwwwwwwwwwwwwwk",
  ".kwwwwwwwwwwwwk.",
  "..kkkkkkkkkkkk.."
];
var CAT_HAPPY = CAT.slice();
CAT_HAPPY[5] = "kwwwkwwwwwwkwwwk";
CAT_HAPPY[6] = "kwwkwkwwwwkwkwwk";
var HEART = [".11.11.", "1111111", "1111111", ".11111.", "..111..", "...1..."];
var CAT_COLORS = { k: "#3a0a26", w: "#fff4fa", p: "#ff8fc7" };

function pixels(map, colors) {
  var w = map[0].length, h = map.length, out = "";
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var c = colors[map[y][x]];
    if (c) out += '<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + c + '"/>';
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" role="img" aria-label="Pixel cat">' + out + "</svg>";
}
function heartSVG(color, size) {
  return pixels(HEART, { "1": color }).replace("<svg ", '<svg width="' + size + '" height="' + (size * 6 / 7) + '" ').replace(' role="img" aria-label="Pixel cat"', "");
}

(function drawHills() {
  var svg = document.getElementById("hills"), s = "";
  function layer(color, base, amp, f1, f2, ph) {
    for (var x = 0; x < 1200; x += 16) {
      var y = base - Math.round((Math.sin(x / f1 + ph) * amp + Math.sin(x / f2 + ph * 2) * amp * .5) / 8) * 8;
      s += '<rect x="' + x + '" y="' + y + '" width="17" height="' + (240 - y) + '" fill="' + color + '"/>';
    }
  }
  var clouds = [[120, 90], [520, 60], [900, 110], [1060, 50]];
  clouds.forEach(function (c) {
    s += '<g fill="#fff0f8" opacity=".9"><rect x="' + c[0] + '" y="' + c[1] + '" width="96" height="16"/><rect x="' + (c[0] + 16) + '" y="' + (c[1] - 16) + '" width="48" height="16"/><rect x="' + (c[0] + 64) + '" y="' + (c[1] - 8) + '" width="16" height="8"/></g>';
  });
  layer("#ff9ccd", 150, 24, 90, 47, 0.6);
  [[60, 70], [92, 100], [130, 60], [1010, 90], [1050, 64], [1090, 84]].forEach(function (b) {
    s += '<rect x="' + b[0] + '" y="' + (190 - b[1]) + '" width="24" height="' + (b[1] + 50) + '" fill="#ff86c2"/>';
  });
  layer("#f0589f", 196, 16, 70, 33, 2.1);
  svg.innerHTML = s;
})();

var floaters = document.getElementById("floaters"), floatCount = 0;
function spawnHeart(burst) {
  if (floatCount > 24) return;
  var el = document.createElement("div");
  el.className = "floater";
  var size = [14, 21, 28][Math.floor(Math.random() * 3)];
  var colors = ["#fff4fa", "#ff5fae", "#e8157b"];
  el.innerHTML = heartSVG(colors[Math.floor(Math.random() * 3)], size);
  el.style.left = Math.random() * 96 + "%";
  el.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
  var dur = 6 + Math.random() * 5;
  el.style.animationDuration = dur + "s";
  if (burst) el.style.animationDelay = Math.random() * 1.2 + "s";
  floaters.appendChild(el); floatCount++;
  setTimeout(function () { el.remove(); floatCount--; }, (dur + 2) * 1000);
}
setInterval(function () { spawnHeart(false); }, 1800);

var app = document.getElementById("app");
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var typer = null;

function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function frame(happy) { return '<div class="frame bob">' + pixels(happy ? CAT_HAPPY : CAT, CAT_COLORS) + "</div>"; }
function show(html) { if (typer) { clearInterval(typer); typer = null; } app.innerHTML = '<section class="screen">' + html + "</section>"; }
function fill(t) { return t.replace(/ ?\{to\}/g, CONFIG.to ? " " + CONFIG.to : ""); }

function screenIntro() {
  show(frame(false) + "<h1>" + (CONFIG.to ? esc(CONFIG.to) + "، " : "") + "عندي حاجة نقولهالك</h1>" +
    '<p class="sub">ياخذ دقيقة برك.</p><button class="btn" id="go" type="button">افتح ‹</button>');
  document.getElementById("go").addEventListener("click", function () { screenLetter(0); });
}

function screenLetter(i) {
  var line = fill(CONFIG.lines[i]);
  show(frame(i === CONFIG.lines.length - 1) + '<div class="dialog" id="box" role="button" tabindex="0"><p id="txt"></p><span class="more" id="more" hidden>▼</span></div>');
  var box = document.getElementById("box"), txt = document.getElementById("txt"), more = document.getElementById("more");
  var words = line.split(" "), pos = 0, done = false;
  function finish() { clearInterval(typer); typer = null; txt.textContent = line; more.hidden = false; done = true; }
  function advance() {
    if (!done) { finish(); return; }
    if (i + 1 < CONFIG.lines.length) screenLetter(i + 1); else screenAsk();
  }
  box.addEventListener("click", advance);
  box.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); } });
  box.focus({ preventScroll: true });
  if (reduce) { finish(); return; }
  typer = setInterval(function () { pos++; txt.textContent = words.slice(0, pos).join(" "); if (pos >= words.length) finish(); }, 110);
}

var ANSWERS = [
  { label: "نحس كيفك", mine: "وأنا زادة نحس كيفك.", reply: "الحمد لله يا ربي.", happy: true },
  { label: "نحب نفكر شوية", mine: "يعطيك الصحة على الصراحة. نحب ناخذ وقتي نفكر.", reply: "باهي خوذ وقتك وقولي كان باهي ولا خايب.", happy: false },
  { label: "نشوفك كami", mine: "يعطيك الصحة إلي قلتلي. نقدرك برشا، أما نشوفك كami.", reply: "يعطيك الصحة على الصراحة، أما راك تبقى غالية عليا.", happy: false }
];

function screenAsk() {
  show(frame(false) + "<h2>شنوة تحسي؟</h2><p class=\"sub\">أي جواب مقبول.</p>" +
    '<div class="stack">' + ANSWERS.map(function (a, i) { return '<button class="opt" type="button" data-i="' + i + '">' + esc(a.label) + "</button>"; }).join("") + "</div>");
  app.querySelectorAll(".opt").forEach(function (b) {
    b.addEventListener("click", function () { screenReply(ANSWERS[Number(b.getAttribute("data-i"))]); });
  });
}

function screenReply(a) {
  if (a.happy) for (var i = 0; i < 26; i++) spawnHeart(true);
  var msg = a.mine;
  show(frame(a.happy) + (a.happy ? "" : "<h1>يعطيك الصحة</h1>") +
    '<div class="ticket">' + esc(a.reply) + (CONFIG.from ? "<br><b>- " + esc(CONFIG.from) + "</b>" : "") + "</div>" +
    '<div class="row"><button class="btn" id="copy" type="button">انسخ جوابي</button><button class="btn ghost" id="back" type="button">بدّل الجواب</button></div>' +
    '<p class="toast" id="toast">انسخو وابعثهولي.</p>' +
    (CONFIG.whatsapp ? '<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + esc(CONFIG.whatsapp) + '?text=' + encodeURIComponent(msg) + '">ابعثو في واتساب</a></div>' : ""));
  var toast = document.getElementById("toast");
  document.getElementById("back").addEventListener("click", screenAsk);
  document.getElementById("copy").addEventListener("click", function () {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = msg; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove(); toast.textContent = ok ? "تنسخ! توا ابعثو." : msg;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(function () { toast.textContent = "تنسخ! توا ابعثو."; }, fallback);
    else fallback();
  });
}

screenIntro();
</script>
</body>
</html>
